<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">VidMate Guide logo</title>
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23d5ab"/>
      <stop offset="1" stop-color="#1bb992"/>
    </linearGradient>
  </defs>
  <!-- Icon: rounded package/app tile with play triangle + download chevron -->
  <g>
    <rect x="2" y="4" width="48" height="48" rx="14" fill="url(#logoGrad)"/>
    <path d="M20 17.5 L34 27.5 L20 37.5 Z" fill="#06110d"/>
    <path d="M26 40 L26 46 M22 43 L26 47 L30 43" stroke="#06110d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="34" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#f2f3f5">VidMate</text>
  <text x="62" y="48" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#23d5ab">GUIDE</text>
</svg>
